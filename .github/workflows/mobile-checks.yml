name: Mobile checks

on:
  push:
    paths:
      - 'mobile/**'
      - 'content/services.ts'
      - 'content/existing-support.ts'
      - 'lib/village.ts'
      - '.github/workflows/mobile-checks.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'content/services.ts'
      - 'content/existing-support.ts'
      - 'lib/village.ts'
      - '.github/workflows/mobile-checks.yml'

permissions:
  contents: read

concurrency:
  group: mobile-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run export
